[package]
name = "pushbench"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Test push notifications from templates in your repo: iOS Simulator, APNs and FCM HTTP v1 in one CLI"
license = "MIT"
repository = "https://github.com/saimskywalker/pushbench"
readme = "README.md"
keywords = ["push-notifications", "apns", "fcm", "ios-simulator", "firebase"]
categories = ["command-line-utilities", "development-tools::testing"]
exclude = [".github/"]

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
dirs = "7.0.0"
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "http2", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.2.0"
serde_json = "1.0.154"
toml = "1.2.2"
uuid = { version = "1.29.3", features = ["v4"] }
